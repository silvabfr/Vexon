<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VEXON</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/utils.js" defer></script>
    <script src="js/produtos.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/carrinho.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/checkout.js" defer></script>

</head>

<body class="auth-body">

<main class="auth-container">

    <a href="index.html" class="logo auth-logo">
        VEXON<span>.</span>
    </a>

    <div class="auth-card">

        <span class="section-label">BEM-VINDO DE VOLTA</span>

        <h1>Entrar</h1>

        <p>Acesse sua conta VEXON.</p>

        <form id="login-form">

            <label for="email">E-mail</label>
            <input
                id="email"
                type="email"
                placeholder="seu@email.com"
                required
            >

            <label for="senha">Senha</label>
            <input
                id="senha"
                type="password"
                placeholder="Sua senha"
                required
            >

            <div class="auth-options">
                <label>
                    <input type="checkbox">
                    Lembrar de mim
                </label>

                <a href="recuperar-senha.html">Esqueci minha senha</a>
            </div>

            <button class="btn btn-primary auth-button">
                Entrar
            </button>

        </form>

        <div class="auth-divider">
            <span>ou</span>
        </div>

        <p class="auth-register">
            Ainda não possui uma conta?
            <a href="cadastro.html">Criar conta</a>
        </p>

    </div>

</main>

</body>
</html>
