<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrinho | VEXON</title>

    <link rel="stylesheet" href="style.css">


    <script
        src="js/utils.js"
        defer
    ></script>

    <script
        src="js/produtos.js"
        defer
    ></script>

    <script
        src="js/layout.js"
        defer
    ></script>

    <script
        src="js/carrinho.js"
        defer
    ></script>

    <script
        src="js/auth.js"
        defer
    ></script>

    <script
        src="js/checkout.js"
        defer
    ></script>

</head>

<body>


    <main>

        <section class="section">

            <div class="container">


                <!-- TÍTULO -->

                <div class="page-header">

                    <span class="section-label">
                        VEXON STORE
                    </span>

                    <h1>
                        Seu carrinho
                    </h1>

                    <p>
                        Confira seus produtos
                        antes de finalizar a compra.
                    </p>

                </div>


                <!-- CARRINHO -->

                <div class="cart-layout">


                    <!-- PRODUTOS -->

                    <div>

                        <div class="cart-items">
                        </div>

                    </div>


                    <!-- RESUMO -->

                    <aside class="cart-summary">


                        <h2>
                            Resumo do pedido
                        </h2>


                        <div>

                            <span>
                                Subtotal
                            </span>

                            <strong>
                                R$ 0,00
                            </strong>

                        </div>


                        <div>

                            <span>
                                Frete
                            </span>

                            <strong>
                                Grátis
                            </strong>

                        </div>


                        <hr>


                        <div class="cart-total">

                            <span>
                                Total
                            </span>

                            <strong>
                                R$ 0,00
                            </strong>

                        </div>


                        <a
                            href="checkout.html"
                            class="btn btn-primary checkout-button"
                        >
                            Finalizar compra
                        </a>


                        <a
                            href="produtos.html"
                            class="continue-shopping"
                        >
                            ← Continuar comprando
                        </a>


                    </aside>


                </div>

            </div>

        </section>

    </main>

</body>

</html>
