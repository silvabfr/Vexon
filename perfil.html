<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil | VEXON</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/utils.js" defer></script>
    <script src="js/produtos.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/carrinho.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/checkout.js" defer></script>
</head>

<body>



<main>

<section class="page-header">
<div class="container">

<span class="section-label">CONTA</span>

<h1>Meu perfil</h1>

<p>Consulte seus dados cadastrados.</p>

</div>
</section>

<section class="section">

<div class="container profile-layout">

<div class="card profile-card">

<div class="profile-avatar">V</div>

<h2 id="profile-name">
Usuário VEXON
</h2>

<p id="profile-email">
Faça login para visualizar sua conta.
</p>

<div class="profile-actions">

<a href="pedidos.html" class="btn btn-primary">
Meus pedidos
</a>

<a href="favoritos.html" class="btn btn-secondary">
Favoritos
</a>

<button
type="button"
class="btn btn-secondary"
id="logout-button">
Sair da conta
</button>

</div>

</div>

<div class="card profile-card">

<h2>Dados da conta</h2>

<div class="profile-data">

<div>
<span>Nome</span>
<strong id="profile-name-data">—</strong>
</div>

<div>
<span>E-mail</span>
<strong id="profile-email-data">—</strong>
</div>

<div>
<span>Status</span>
<strong id="profile-status">Não conectado</strong>
</div>

</div>

</div>

</div>

</section>

</main>





</body>
</html>
