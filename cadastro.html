<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | VEXON</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/utils.js" defer></script>
    <script src="js/produtos.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/carrinho.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/checkout.js" defer></script>

</head>

<body class="auth-body">

<main class="auth-container">

    <a href="index.html" class="logo auth-logo">
        VEXON<span>.</span>
    </a>

    <div class="auth-card">

        <span class="section-label">VEXON ACCOUNT</span>

        <h1>Criar conta</h1>

        <p>Faça parte da comunidade VEXON.</p>

        <form id="cadastro-form">

            <label for="nome">Nome</label>
            <input
                id="nome"
                type="text"
                placeholder="Seu nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                id="email"
                type="email"
                placeholder="seu@email.com"
                required
            >

            <label for="senha">Senha</label>
            <input
                id="senha"
                type="password"
                placeholder="Crie uma senha"
                required
            >

            <label for="confirmar-senha">Confirmar senha</label>
            <input
                id="confirmar-senha"
                type="password"
                placeholder="Repita sua senha"
                required
            >

            <button class="btn btn-primary auth-button">
                Criar minha conta
            </button>

        </form>

        <p class="auth-register">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

    </div>

</main>

</body>
</html>
